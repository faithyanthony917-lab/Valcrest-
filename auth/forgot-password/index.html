<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot Password | Valcrest Meridian Capital</title>
    <link rel="stylesheet" href="../auth.css" />
    <link rel="stylesheet" href="../../assets/css/site-navigation.css">
</head>
  <body>
    <main class="auth-shell">
      <a class="auth-brand" href="../../">Valcrest Meridian Capital</a>
      <section class="auth-card">
        <h1>Forgot password?</h1>
        <p>Enter your account email and we will send reset instructions if it matches an active account.</p>
        <form id="forgot-form">
          <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email" /></div>
          <button class="button" type="submit">Send reset link</button>
          <p class="auth-message" role="status"></p>
        </form>
        <div class="auth-links"><a href="../login/">Back to login</a><a href="../register/">Create an account</a></div>
      </section>
    </main>
    <script src="../forgot-password.js"></script>
    <script src="../../assets/js/site-navigation.js"></script>
</body>
</html>
