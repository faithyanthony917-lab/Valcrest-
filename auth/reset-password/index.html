<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password | Valcrest Meridian Capital</title>
    <link rel="stylesheet" href="../auth.css" />
    <link rel="stylesheet" href="../../assets/css/site-navigation.css">
</head>
  <body>
    <main class="auth-shell">
      <a class="auth-brand" href="../../">Valcrest Meridian Capital</a>
      <section class="auth-card">
        <h1>Reset your password</h1>
        <p>Choose a new password for your account.</p>
        <form id="reset-form">
          <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" minlength="12" required autocomplete="new-password" /></div>
          <div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirmPassword" type="password" minlength="12" required autocomplete="new-password" /></div>
          <button class="button" type="submit">Reset password</button>
          <p class="auth-message" role="status"></p>
        </form>
        <div class="auth-links"><a href="../login/">Back to login</a></div>
      </section>
    </main>
    <script src="../reset-password.js"></script>
    <script src="../../assets/js/site-navigation.js"></script>
</body>
</html>
